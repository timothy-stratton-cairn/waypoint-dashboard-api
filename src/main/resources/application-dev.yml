waypoint:
  dashboard:
    base-url: http://localhost:8083
    s3:
      bucket: waypoints-dashboard-api
      import-data-key-prefix: import-data/
      homework-response-key-prefix: homework/
      database-dump-prefix: database-dump/
      step-attachment-key-prefix: step-attachments/
    protocol-triggering:
      schedule: 0 * * * * *
    email-notification-queue-url: https://sqs.us-east-1.amazonaws.com/471112975273/dev-test-queue

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8082
  application:
    name: waypoint-dashboard-api
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:mysql://localhost:3306/dashboarddb?useSSL=false
    username: rob
    password: 2muchjoy.
    hikari:
      poolName: Hikari
      auto-commit: true
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
  liquibase:
    enabled: false
    drop-first: false
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQL8Dialect


server:
  port: 8083

logging:
  level:
    org.springframework.security: INFO
    org.springframework.web.servlet.mvc.method.annotation: INFO